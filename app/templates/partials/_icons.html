{# Line icons (paths based on Tabler Icons, MIT). Usage: {{ icon("home") }} #}
{% macro icon(name, size=20) %}
<svg class="ico" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == "home" %}
  <path d="M5 12H3l9-9 9 9h-2"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/><path d="M10 21v-5h4v5"/>
{% elif name == "list" %}
  <path d="M4 6h16M4 12h16M4 18h12"/>
{% elif name == "budget" %}
  <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>
{% elif name == "chart" %}
  <path d="M6 20v-6M12 20V8M18 20v-9"/>
{% elif name == "settings" %}
  <path d="M4 6h8M16 6h4M4 12h2M10 12h10M4 18h11M19 18h1"/><circle cx="14" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>
{% elif name == "plus" %}
  <path d="M12 5v14M5 12h14"/>
{% elif name == "bell" %}
  <path d="M10 5a2 2 0 1 1 4 0 7 7 0 0 1 4 6v3a4 4 0 0 0 2 3H4a4 4 0 0 0 2-3v-3a7 7 0 0 1 4-6"/><path d="M9 17v1a3 3 0 0 0 6 0v-1"/>
{% elif name == "search" %}
  <circle cx="10" cy="10" r="7"/><path d="M21 21l-6-6"/>
{% elif name == "wallet" %}
  <rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M15 15h2"/>
{% elif name == "logout" %}
  <path d="M14 8V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2v-2"/><path d="M9 12h12l-3-3M18 15l3-3"/>
{% endif %}
</svg>
{% endmacro %}
